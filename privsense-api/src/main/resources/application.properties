# Server configuration
server.port=8080


# Application name
spring.application.name=privsense-api


# SpringDoc OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Database connection configuration
# Default database for application's internal usage
# This database will be used for storing the application's internal data
# It's different from the databases that will be scanned by the application
privsense.db.default-type=H2
privsense.db.default.host=mem
privsense.db.default.port=
privsense.db.default.database=privsensedb
privsense.db.default.username=sa
privsense.db.default.password=

# Connection pool settings
privsense.db.pool.max-size=20
privsense.db.pool.idle-timeout=300000
privsense.db.pool.connection-timeout=30000
privsense.db.pool.max-lifetime=1800000

# H2 specific configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# PII Detection configuration
privsense.pii.detection.confidence-threshold=0.7
privsense.pii.detection.default-strategies=HEURISTIC,REGEX

# NER service configuration
privsense.ner.service.url=http://python-ner-service:5000
privsense.ner.service.timeout=10000
privsense.ner.service.retry.attempts=3
privsense.ner.service.circuit-breaker.enabled=true
privsense.ner.service.circuit-breaker.failure-threshold=5
privsense.ner.service.circuit-breaker.reset-timeout-ms=30000

# Data sampling configuration
privsense.sampling.default-size=100
privsense.sampling.max-size=1000
privsense.sampling.default-strategy=RANDOM

# Caching configuration
spring.cache.cache-names=tablesList,tableMetadata,columnSamples,piiDetection
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=30m

# Async task execution
privsense.async.core-pool-size=5
privsense.async.max-pool-size=10
privsense.async.queue-capacity=25

# Logging
logging.level.com.cgi.privsense=INFO
logging.file.name=logs/privsense.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security (basic auth for development, should be replaced in production)
spring.security.user.name=admin
spring.security.user.password=admin

# CORS configuration
privsense.api.cors.allowed-origins=*
privsense.api.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
privsense.api.cors.allowed-headers=*
privsense.api.cors.max-age=3600

# Rate limiting
privsense.api.rate-limit.enabled=true
privsense.api.rate-limit.limit=100
privsense.api.rate-limit.refresh-period=60

# Spring Cloud compatibility
spring.cloud.compatibility-verifier.enabled=false