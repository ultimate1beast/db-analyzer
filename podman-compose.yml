version: '3.8'

services:
  # PostgreSQL database for PrivSense
  postgres:
    image: postgres:15
    tls_verify: false
    pull_policy: never
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=privsense
      - POSTGRES_PASSWORD=privsense
      - POSTGRES_DB=privsense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python NER service for PII detection
  ner-service:
    build:
      context: ./python-ner-service
      dockerfile: Dockerfile
    container_name: ner-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PrivSense API service
  privsense-api:
    build:
      context: ./privsense-api
      dockerfile: Dockerfile
    container_name: privsense-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/privsense
      - SPRING_DATASOURCE_USERNAME=privsense
      - SPRING_DATASOURCE_PASSWORD=privsense
      - PRIVSENSE_NER_SERVICE_URL=http://ner-service:5000
    depends_on:
      - postgres
      - ner-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    tls_verify: false
    pull_policy: never 
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    tls_verify: false
    pull_policy: never 
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus